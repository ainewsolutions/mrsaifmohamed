<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مستر سيف محمد - الرياضيات</title>
    <link rel="stylesheet" href="assets/tailwind.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/common.js"></script>
</head>
<body class="text-gray-800 min-h-screen pb-24 relative">

    <header class="fixed top-0 w-full bg-white/95 backdrop-blur-md shadow-sm z-40 h-20 flex items-center px-4 md:px-8 border-b border-blue-100">
        <h1 class="font-extrabold text-blue-900 text-lg md:text-2xl brand-name">مستر سيف محمد<small dir="ltr">Mr. Saif Mohamed</small></h1>
    </header>
    <div class="fixed top-20 w-full z-40 brand-strip"></div>

    <div class="max-w-4xl mx-auto p-4 relative pt-28">
        <div class="space-y-6">
            <div class="glass-panel rounded-2xl p-6 shadow-lg relative overflow-hidden flex flex-col md:flex-row items-center gap-6 mt-4">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-yellow-200 rounded-full opacity-60 blur-xl"></div>
                <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-blue-200 rounded-full opacity-60 blur-xl"></div>
                <div class="w-full text-center z-10 flex flex-col justify-center">
                    <h2 class="text-2xl md:text-3xl font-bold text-gray-700 mb-2" id="grade"></h2>
                    <h3 class="text-xl md:text-2xl text-blue-700 font-extrabold mb-2" id="term"></h3>
                    <p class="text-gray-500 font-bold" id="unit"></p>
                    <div class="mt-4 border-t border-blue-100 pt-4">
                        <p class="text-sm text-gray-500 font-bold">مع المستر</p>
                        <p class="text-3xl font-extrabold text-blue-900">سيف محمد</p>
                        <p class="text-lg font-extrabold text-yellow-600" dir="ltr">Mr. Saif Mohamed</p>
                    </div>
                </div>
            </div>

            <h3 class="text-center font-bold text-gray-600 mt-8 mb-4 text-lg">اختر الدرس لتبدأ التحدى</h3>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5" id="lessons"></div>

            <div class="glass-panel rounded-2xl p-5 text-center mt-8">
                <p class="font-bold text-gray-600">درسان × 6 ألعاب تفاعلية × 15 سؤالًا - بدون وقت محدد</p>
                <p class="mt-3 text-yellow-600 font-extrabold">مع مستر سيف محمد .. الرياضيات أسهل</p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('grade').innerText = TEACHER.grade;
        document.getElementById('term').innerText = TEACHER.term;
        document.getElementById('unit').innerText = TEACHER.unit;
        const box = document.getElementById('lessons');
        Object.keys(LESSONS).forEach(id => {
            const L = LESSONS[id];
            box.insertAdjacentHTML('beforeend', `
            <a href="game.html?l=${id}" class="btn-bounce bg-gradient-to-l ${L.color} text-white p-6 rounded-2xl shadow-lg flex items-center justify-between min-h-[130px] hover:shadow-2xl">
                <div class="text-right">
                    <p class="text-xs font-bold text-white/80 mb-1">${L.order}</p>
                    <h4 class="font-extrabold text-2xl mb-1">${L.title}</h4>
                    <p class="text-sm text-white/90"><i class="fa-solid fa-gamepad"></i> 6 ألعاب - 90 سؤالًا</p>
                </div>
                <i class="fa-solid ${L.icon} text-5xl opacity-80"></i>
            </a>`);
        });
    </script>
</body>
</html>
